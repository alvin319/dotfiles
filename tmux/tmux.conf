# Mouse: click panes/windows, drag to resize, wheel to scroll back
set -g mouse on
set -g focus-events on

# Scrollback
set -g history-limit 50000

# Colors: true color inside tmux, and tell apps we support RGB
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

# Snappy escape (vim/nvim), start numbering at 1, keep windows numbered contiguously
set -sg escape-time 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Keep the working directory when opening new panes/windows
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
